services:
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile

    image: learning-mcp-server:learning-mcp-backend

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]